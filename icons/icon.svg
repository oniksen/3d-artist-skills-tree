<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="80%">
      <stop offset="0%" stop-color="#14141f"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </radialGradient>
    <linearGradient id="palette" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="50%" stop-color="#5a4fd1"/>
      <stop offset="100%" stop-color="#00cec9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g id="motif">
    <ellipse cx="256" cy="274" rx="148" ry="120" fill="url(#palette)"/>
    <ellipse cx="208" cy="196" rx="34" ry="20" fill="#ffffff" opacity="0.14" transform="rotate(-24 208 196)"/>
    <circle cx="182" cy="332" r="24" fill="#0d0d14"/>
    <circle cx="198" cy="220" r="22" fill="#6c5ce7" filter="url(#glow)"/>
    <circle cx="316" cy="202" r="22" fill="#00cec9"/>
    <circle cx="342" cy="290" r="22" fill="#fdcb6e"/>
    <circle cx="238" cy="336" r="22" fill="#fd79a8"/>
  </g>
</svg>