<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="format-detection" content="telephone=no,email=no,address=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="3D Artist">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-icon-180.png">
  <title id="siteTitle">3D Artist Master Skill Tree</title>
  <meta id="siteDesc" name="description" content="Interactive skill tree for 3D artists — Career progression from Beginner to Art Director">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/canvas.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/side-nav.css">
  <link rel="stylesheet" href="css/hero.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/level-nav.css">
  <link rel="stylesheet" href="css/level-info.css">
  <link rel="stylesheet" href="css/progress.css">
  <link rel="stylesheet" href="css/skills.css">
  <link rel="stylesheet" href="css/modal.css">
  <link rel="stylesheet" href="css/streak.css">
  <link rel="stylesheet" href="css/achievements.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/roadmap.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/bottom-nav.css">
  <link rel="stylesheet" href="css/toast.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>

  <header class="top-bar">
    <button class="brand-btn top-bar-brand" id="brandBtn" title="3D Skill Tree">
      <span class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg></span>
      <span class="brand-text" id="brandText">3D Skill Tree</span>
    </button>
    <div class="top-bar-right">
      <button class="score-chip hidden" id="scoreChip" title="Score"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg> <span id="scoreChipVal">0</span></button>
      <div id="streakBadge" class="streak-badge hidden"></div>
      <div id="userMenu"></div>
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ru">RU</button>
      </div>
    </div>
  </header>

  <nav class="side-nav" id="sideNav" aria-label="Основная навигация">
    <div class="side-brand">
      <button class="brand-btn" id="sideBrandBtn" title="3D Skill Tree">
        <span class="brand-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"/><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/></svg></span>
        <span class="brand-text side-brand-text" id="sideBrandText">3D Skill Tree</span>
      </button>
    </div>
    <div class="side-nav-inner">
      <a class="side-nav-link active" data-view="dashboard" title="Dashboard"><span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span><span class="nav-label">Dashboard</span></a>
      <a class="side-nav-link" data-view="roadmap" title="Roadmap"><span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg></span><span class="nav-label">Roadmap</span></a>
      <a class="side-nav-link" data-view="tree" title="Tree"><span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></svg></span><span class="nav-label">Tree</span></a>
      <a class="side-nav-link" data-view="achievements" title="Achievements"><span><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2"/><path d="M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2"/><path d="M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3"/><path d="M4 22h16"/><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/><path d="M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3"/></svg></span><span class="nav-label">Achievements</span></a>
    </div>
  </nav>

  <div id="streakPopover" class="streak-popover hidden"></div>

  <div class="app" id="viewTree">
    <header class="hero">
      <h1 id="heroTitle">3D Artist Master Skill Tree</h1>
      <p class="subtitle" id="heroSubtitle">Career progression from Beginner to Art Director — Game Art, AAA/AA/Indie, Real-time 3D, Unreal Engine, Film/VFX fundamentals</p>
      <div class="stats-bar">
        <div class="stat">
          <div class="stat-val" id="totalSkills">—</div>
          <div class="stat-label" id="statSkillsLabel">Skills</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="totalCategories">—</div>
          <div class="stat-label" id="statCategoriesLabel">Categories</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="totalLevels">—</div>
          <div class="stat-label" id="statLevelsLabel">Career Levels</div>
        </div>
        <div class="stat">
          <div class="stat-val">10</div>
          <div class="stat-label" id="statMaxDiffLabel">Max Difficulty</div>
        </div>
      </div>
    </header>

    <div class="controls">
      <div class="search-box">
        <span class="search-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg></span>
        <input type="text" id="searchInput" placeholder="Search skills by name, description, or category...">
        <button class="search-filter-btn" id="searchFilterBtn" aria-label="Open filters"><svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="M10 8h4"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M17 16h4"/><path d="M19 12V3"/><path d="M19 21v-5"/><path d="M3 14h4"/><path d="M5 10V3"/><path d="M5 21v-7"/></svg></button>
      </div>
    </div>

    <nav class="level-nav">
      <div class="level-nav-inner" id="levelNav"></div>
    </nav>

    <section class="level-info" id="levelInfo"></section>

    <main class="skills-container" id="skillsContainer"></main>
  </div>

  <div class="app-view" id="viewAchievements" hidden>
    <section class="achievements-page">
      <div class="achievements-head">
        <h1 id="achTitle">Achievements</h1>
        <div class="achievements-summary" id="achSummary"></div>
      </div>
      <div class="achievements-groups" id="achievementsGrid"></div>
    </section>
  </div>

  <div class="app-view" id="viewRoadmap" hidden>
    <section class="roadmap-page" id="roadmapPage"></section>
  </div>

  <div class="app-view" id="viewDashboard" hidden>
    <section class="dashboard-page" id="dashboardPage"></section>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="bottom-nav-btn active" data-view="dashboard"><span class="bn-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg></span><span class="bn-label">Dashboard</span></button>
    <button class="bottom-nav-btn" data-view="roadmap"><span class="bn-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg></span><span class="bn-label">Roadmap</span></button>
    <button class="bottom-nav-btn" data-view="tree"><span class="bn-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="M15 6a9 9 0 0 0-9 9V3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/></svg></span><span class="bn-label">Tree</span></button>
    <button class="bottom-nav-btn" data-view="achievements"><span class="bn-icon"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="luc"><path d="M10 14.66V17a1 1 0 0 1-1 1 2 2 0 0 0-2 2v2"/><path d="M14 14.66V17a1 1 0 0 0 1 1 2 2 0 0 1 2 2v2"/><path d="M17.916 10H19.5A2.5 2.5 0 0 0 22 7.5V5a1 1 0 0 0-1-1h-3"/><path d="M4 22h16"/><path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z"/><path d="M6.084 10H4.5A2.5 2.5 0 0 1 2 7.5V5a1 1 0 0 1 1-1h3"/></svg></span><span class="bn-label">Achievements</span></button>
  </nav>

  <div class="modal-overlay" id="loginOverlay">
    <div class="modal auth-modal" id="loginContent"></div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <aside class="filter-sidebar" id="filterSidebar" aria-hidden="true">
    <div class="filter-sidebar-backdrop" id="filterSidebarBackdrop"></div>
    <div class="filter-sidebar-panel" role="dialog" aria-modal="true">
      <div class="filter-sidebar-head">
        <h3 id="filterSidebarTitle">Categories</h3>
        <button class="filter-sidebar-close" id="filterSidebarClose" aria-label="Close">&times;</button>
      </div>
      <div class="filter-group filter-group-sidebar" id="categoryFilters"></div>
    </div>
  </aside>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/bus.js"></script>
  <script src="js/store.js"></script>
  <script src="js/store-firestore.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/streak.js"></script>
  <script src="js/canvas.js"></script>
  <script src="js/search.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/level-nav.js"></script>
  <script src="js/roadmap.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
